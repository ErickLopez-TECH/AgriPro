name: AI Code Review with Auto-Retry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Delta Code Review with Project Rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GEMINI_API_KEY: ${{ secrets.DELTA_API_KEY }}
        run: |
          echo "Obteniendo los cambios del Pull Request..."
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }} HEAD)
          
          if [ -z "$DIFF" ]; then
            echo "No se encontraron cambios en este PR para revisar."
            exit 0
          fi

          if [ -f "REGLAS_PROYECTO.md" ]; then
            REGLAS=$(cat REGLAS_PROYECTO.md)
          else
            REGLAS="Aplica buenas prácticas generales de arquitectura en capas."
          fi

          jq -n \
            --arg reglas "$REGLAS" \
            --arg diff "$DIFF" \
            '{
              contents: [{
                parts: [{
                  text: ("Eres un revisor de código senior y arquitecto de software. Analiza los cambios de este Pull Request (diff) verificando estrictamente que cumplan con el siguiente documento de indicaciones del proyecto.\n\n=== DOCUMENTO DE INDICACIONES ===\n" + $reglas + "\n\n=== CAMBIOS DEL PULL REQUEST (DIFF) ===\n" + $diff)
                }]
              }]
            }' > payload.json

          attempt=1
          success=0

          while [ $success -eq 0 ] && [ $attempt -le 3 ]; do
            echo "--- Intento número $attempt de contacto con la IA ---"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @payload.json)

            HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "Código HTTP recibido: $HTTP_STATUS"

            REVIEW_TEXT=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text // empty')

            if [ "$HTTP_STATUS" -eq 200 ] && [ -n "$REVIEW_TEXT" ] && [ "$REVIEW_TEXT" != "null" ]; then
              echo "¡Respuesta recibida correctamente de la IA!"
              COMMENT_BODY=$(printf "### 🤖 Revisión de Código Automática (Delta)\n\n%s" "$REVIEW_TEXT")
              gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
              success=1
            else
              echo "La IA no respondió o la API devolvió un error. Reintentando en 10 segundos..."
              echo "Respuesta de la API: $HTTP_BODY"
              sleep 10
              attempt=$((attempt + 1))
            fi
          done

          if [ $success -eq 0 ]; then
            echo "Error: No se pudo obtener respuesta de la IA tras varios intentos."
            exit 1
          fi
