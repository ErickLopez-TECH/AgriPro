name: AI Code Review - Delta (Groq Multi-Model)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  delta-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Delta Code Review Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import json
          import urllib.request
          import urllib.error
          import time

          api_key = os.environ.get("DELTA_API_KEY", "").strip()
          
          if not api_key:
              print("Error crítico: La variable DELTA_API_KEY no está configurada o se encuentra vacía.")
              exit(1)

          pr_number = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]

          print("Delta: Obteniendo los cambios del Pull Request...")
          subprocess.run(["git", "fetch", "origin", base_ref], check=True)
          diff_result = subprocess.run(["git", "diff", f"origin/{base_ref}", "HEAD"], capture_output=True, text=True)
          diff = diff_result.stdout

          if not diff.strip():
              print("Delta: No se encontraron cambios en este PR para revisar.")
              exit(0)

          try:
              with open("REGLAS_PROYECTO.md", "r", encoding="utf-8") as f:
                  reglas = f.read()
          except FileNotFoundError:
              reglas = "Aplica buenas prácticas generales de arquitectura en capas y estándares de desarrollo."

          prompt = f"""Eres Delta, el sistema experto de revisión de código automatizada y arquitectura de software para el proyecto AgriPro. Analiza los cambios de este Pull Request (diff) verificando estrictamente que cumplan con el siguiente documento de reglas e indicaciones del proyecto.

          === DOCUMENTO DE REGLAS DE DELTA ===
          {reglas}

          === CAMBIOS DEL PULL REQUEST (DIFF) ===
          {diff}

          Proporciona recomendaciones directas, concisas y estructuradas indicando si se infringe alguna regla arquitectónica, de capas o de negocio, destacando errores lógicos y posibles mejoras."""

          url = "https://api.groq.com/openai/v1/chat/completions"
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}",
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          # Lista actualizada de modelos vigentes en Groq
          models_to_try = [
              "llama-3.3-70b-specdec",
              "meta-llama/llama-4-scout-17b-16e-instruct",
              "qwen/qwen3-32b",
              "llama-3.1-70b-versatile"
          ]

          success = False
          review_text = ""
          used_model = ""

          for model_name in models_to_try:
              print(f"--- Delta: Intentando análisis con el modelo [{model_name}] ---")
              payload = {
                  "model": model_name,
                  "messages": [{"role": "user", "content": prompt}]
              }
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              
              try:
                  with urllib.request.urlopen(req) as response:
                      res_body = json.loads(response.read().decode("utf-8"))
                      review_text = res_body["choices"][0]["message"]["content"]
                      used_model = model_name
                      success = True
                      print(f"¡Éxito con el modelo {model_name}!")
                      break
              except urllib.error.HTTPError as e:
                  error_detail = e.read().decode("utf-8")
                  print(f"Aviso: El modelo {model_name} falló con HTTP {e.code}: {error_detail}")
                  continue
              except Exception as e:
                  print(f"Aviso: Error inesperado con {model_name}: {e}")
                  continue

          if success:
              comment_body = f"### 🤖 Reporte de Revisión de Delta (`{used_model}`)\n\n{review_text}"
              subprocess.run(["gh", "pr", "comment", pr_number, "--body", comment_body], check=True)
              print("¡Delta ha publicado su reporte de revisión exitosamente en el Pull Request!")
          else:
              print("Error crítico: Delta no pudo completar la revisión con ninguno de los modelos probados.")
              exit(1)
          EOF
