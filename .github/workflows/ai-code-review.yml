name: AI Code Review - Delta

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  delta-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Delta Code Review Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GEMINI_API_KEY: ${{ secrets.DELTA_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import json
          import urllib.request
          import urllib.error
          import time

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          
          if not api_key:
              print("Error crítico: La variable DELTA_API_KEY no está configurada o se encuentra vacía.")
              exit(1)

          pr_number = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]

          print("Delta: Obteniendo los cambios del Pull Request...")
          subprocess.run(["git", "fetch", "origin", base_ref], check=True)
          diff_result = subprocess.run(["git", "diff", f"origin/{base_ref}", "HEAD"], capture_output=True, text=True)
          diff = diff_result.stdout

          if not diff.strip():
              print("Delta: No se encontraron cambios en este PR para revisar.")
              exit(0)

          try:
              with open("REGLAS_PROYECTO.md", "r", encoding="utf-8") as f:
                  reglas = f.read()
          except FileNotFoundError:
              reglas = "Aplica buenas prácticas generales de arquitectura en capas y estándares de desarrollo."

          prompt = f"""Eres Delta, el sistema experto de revisión de código automatizada y arquitectura de software para el proyecto. Analiza los cambios de este Pull Request (diff) verificando estrictamente que cumplan con el siguiente documento de reglas e indicaciones del proyecto.

          === DOCUMENTO DE REGLAS DE DELTA ===
          {reglas}

          === CAMBIOS DEL PULL REQUEST (DIFF) ===
          {diff}

          Proporciona recomendaciones directas, concisas y estructuradas indicando si se infringe alguna regla arquitectónica, de capas o de negocio, destacando errores lógicos y posibles mejoras."""

          # Configuración inteligente según el tipo de clave (AQ... o AIza...)
          headers = {"Content-Type": "application/json"}
          if api_key.startswith("AQ"):
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"
              headers["Authorization"] = f"Bearer {api_key}"
              print("Delta: Utilizando autenticación por Bearer Token (AQ...).")
          else:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
              print("Delta: Utilizando autenticación por API Key (AIza...).")

          payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers=headers, method="POST")

          success = False
          for attempt in range(1, 4):
              print(f"--- Delta: Intento número {attempt} de análisis con IA ---")
              try:
                  with urllib.request.urlopen(req) as response:
                      res_body = json.loads(response.read().decode("utf-8"))
                      review_text = res_body["candidates"][0]["content"]["parts"][0]["text"]
                      
                      comment_body = f"### 🤖 Reporte de Revisión de Delta\n\n{review_text}"
                      subprocess.run(["gh", "pr", "comment", pr_number, "--body", comment_body], check=True)
                      print("¡Delta ha publicado su reporte de revisión exitosamente en el Pull Request!")
                      success = True
                      break
              except urllib.error.HTTPError as e:
                  error_detail = e.read().decode("utf-8")
                  print(f"Error HTTP {e.code} en el intento {attempt}: {error_detail}")
                  time.sleep(10)
              except Exception as e:
                  print(f"Error inesperado en el intento {attempt}: {e}")
                  time.sleep(10)

          if not success:
              print("Error: Delta no pudo completar la revisión tras varios intentos.")
              exit(1)
          EOF
