name: AI Code Review - Delta (Groq Filtered)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  delta-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Delta Code Review Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import json
          import urllib.request
          import urllib.error
          import time

          api_key = os.environ.get("DELTA_API_KEY", "").strip()
          
          if not api_key:
              print("Error crítico: La variable DELTA_API_KEY no está configurada o se encuentra vacía.")
              exit(1)

          pr_number = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}",
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
          }

          # 1. AUTODETECCIÓN Y FILTRADO INTELIGENTE
          print("Delta: Consultando modelos activos disponibles en tu cuenta de Groq...")
          selected_model = None
          try:
              models_req = urllib.request.Request("https://api.groq.com/openai/v1/models", headers=headers, method="GET")
              with urllib.request.urlopen(models_req) as res:
                  body = json.loads(res.read().decode("utf-8"))
                  
                  # Filtrar para descartar audio, traducciones, embeddings o filtros
                  excluded_terms = ["whisper", "embed", "guard", "orpheus", "allam"]
                  available_models = [
                      m["id"] for m in body.get("data", []) 
                      if not any(term in m["id"] for term in excluded_terms)
                  ]
                  print(f"Modelos de texto filtrados disponibles: {available_models}")
                  
                  # Priorizar modelos de texto generales ideales para código
                  preferred_order = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"]
                  for pref in preferred_order:
                      if pref in available_models:
                          selected_model = pref
                          break
                  
                  if not selected_model and available_models:
                      selected_model = available_models[0]
          except Exception as e:
              print(f"Aviso al consultar la lista de modelos: {e}")

          if not selected_model:
              selected_model = "openai/gpt-oss-120b"

          print(f"Delta: Modelo de texto seleccionado -> {selected_model}")

          # 2. Obtener los cambios del Pull Request (FILTRANDO imágenes, binarios y autogenerados)
          print("Delta: Obteniendo los cambios del Pull Request...")
          subprocess.run(["git", "fetch", "origin", base_ref], check=True)
          
          # Se excluyen explícitamente imágenes, archivos pesados y diseñadores gráficos de Java Swing para evitar saturar tokens
          diff_result = subprocess.run([
              "git", "diff", f"origin/{base_ref}", "HEAD", "--", 
              ".", 
              ":!*.png", ":!*.jpg", ":!*.jpeg", ":!*.gif", ":!*.ico", 
              ":!*.pdf", ":!*.zip", ":!*.exe", ":!*.jar",
              ":!*Designer.java"
          ], capture_output=True, text=True)
          diff = diff_result.stdout

          if not diff.strip():
              print("Delta: No se encontraron cambios de código relevantes en este PR para revisar.")
              exit(0)

          # Mecanismo de seguridad: Truncar el diff si excede un límite seguro de caracteres
          MAX_DIFF_LENGTH = 15000
          if len(diff) > MAX_DIFF_LENGTH:
              print(f"Delta: El diff es muy extenso ({len(diff)} chars), recortando para ajustarse a los límites de tokens de Groq...")
              diff = diff[:MAX_DIFF_LENGTH] + "\n\n[... Diff truncado por superar el límite de tamaño de tokens de la API ...]"

          try:
              with open("REGLAS_PROYECTO.md", "r", encoding="utf-8") as f:
                  reglas = f.read()
          except FileNotFoundError:
              reglas = "Aplica buenas prácticas generales de arquitectura en capas y estándares de desarrollo."

          prompt = f"""Eres Delta, el sistema experto de revisión de código automatizada y arquitectura de software. Analiza los cambios de este Pull Request (diff) verificando estrictamente que cumplan con el siguiente documento de reglas e indicaciones del proyecto.

          === DOCUMENTO DE REGLAS DE DELTA ===
          {reglas}

          === CAMBIOS DEL PULL REQUEST (DIFF) ===
          {diff}

          Proporciona recomendaciones directas, concisas y estructuradas indicando si se infringe alguna regla arquitectónica, de capas o de negocio, destacando errores lógicos y posibles mejoras."""

          url = "https://api.groq.com/openai/v1/chat/completions"
          payload = {
              "model": selected_model,
              "messages": [{"role": "user", "content": prompt}]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers=headers, method="POST")

          success = False
          for attempt in range(1, 4):
              print(f"--- Delta: Intento número {attempt} con el modelo [{selected_model}] ---")
              try:
                  with urllib.request.urlopen(req) as response:
                      res_body = json.loads(response.read().decode("utf-8"))
                      review_text = res_body["choices"][0]["message"]["content"]
                      
                      comment_body = f"### 🤖 Reporte de Revisión de Delta (`{selected_model}`)\n\n{review_text}"
                      subprocess.run(["gh", "pr", "comment", pr_number, "--body", comment_body], check=True)
                      print("¡Delta ha publicado su reporte de revisión exitosamente en el Pull Request!")
                      success = True
                      break
              except urllib.error.HTTPError as e:
                  error_detail = e.read().decode("utf-8")
                  print(f"Error HTTP {e.code} en el intento {attempt}: {error_detail}")
                  time.sleep(10)
              except Exception as e:
                  print(f"Error inesperado en el intento {attempt}: {e}")
                  time.sleep(10)

          if not success:
              print("Error crítico: Delta no pudo completar la revisión.")
              exit(1)
          EOF
