name: AI Code Review with Auto-Retry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Delta Code Review with Python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GEMINI_API_KEY: ${{ secrets.DELTA_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import json
          import urllib.request
          import time

          api_key = os.environ["GEMINI_API_KEY"]
          pr_number = os.environ["PR_NUMBER"]
          base_ref = os.environ["BASE_REF"]

          print("Obteniendo los cambios del Pull Request...")
          subprocess.run(["git", "fetch", "origin", base_ref], check=True)
          diff_result = subprocess.run(["git", "diff", f"origin/{base_ref}", "HEAD"], capture_output=True, text=True)
          diff = diff_result.stdout

          if not diff.strip():
              print("No se encontraron cambios en este PR para revisar.")
              exit(0)

          try:
              with open("REGLAS_PROYECTO.md", "r", encoding="utf-8") as f:
                  reglas = f.read()
          except FileNotFoundError:
              reglas = "Aplica buenas prácticas generales de arquitectura en capas."

          prompt = f"""Eres un revisor de código senior y arquitecto de software. Analiza los cambios de este Pull Request (diff) verificando estrictamente que cumplan con el siguiente documento de indicaciones del proyecto.

          === DOCUMENTO DE INDICACIONES ===
          {reglas}

          === CAMBIOS DEL PULL REQUEST (DIFF) ===
          {diff}

          Proporciona recomendaciones directas, concisas y estructuradas señalando si se incumple alguna regla del documento, posibles errores lógicos o mejoras necesarias."""

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})

          success = False
          for attempt in range(1, 4):
              print(f"--- Intento número {attempt} de contacto con la IA ---")
              try:
                  with urllib.request.urlopen(req) as response:
                      res_body = json.loads(response.read().decode("utf-8"))
                      review_text = res_body["candidates"][0]["content"]["parts"][0]["text"]
                      
                      comment_body = f"### 🤖 Revisión de Código Automática (Delta)\n\n{review_text}"
                      subprocess.run(["gh", "pr", "comment", pr_number, "--body", comment_body], check=True)
                      print("¡Respuesta recibida y comentada exitosamente en el Pull Request!")
                      success = True
                      break
              except Exception as e:
                  print(f"Error en el intento {attempt}: {e}")
                  time.sleep(10)

          if not success:
              print("Error: No se pudo obtener respuesta de la IA tras varios intentos.")
              exit(1)
          EOF
